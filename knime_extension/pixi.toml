[pypi-dependencies]
ipinfo = "==5.1.1"
sodapy = "==2.2.0"
# pygeoda dropped (test branch): 0.1.2 has no macOS-x86_64 (osx-64) wheel, only
# linux-x86_64 / win_amd64 / macOS-arm64. build-python-extension packs all 4 KNIME
# platforms and rejects non-wheel deps, so osx-64 fails. pygeoda is lazy-imported in
# src/nodes/spatialclustering.py, so only the LISA / local-spatial-autocorrelation
# nodes are affected; the rest of the extension loads and tests normally.

[feature.build.dependencies]
python = "3.13.*"
knime-extension-bundling = "5.12.*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "build-python-extension . {{ dest }} --disable-strict-enforcement --update-sites-version 5.12" }

[environments]
build = {features = ["build"], no-default-feature = true}
