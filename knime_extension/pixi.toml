[workspace]
name = "geospatial_env"
channels = ["knime/label/nightly", "knime", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
format = { cmd = "ruff format ." }

[dependencies]
python = "*"
# The knime-* packages are the AP-side API binding, not ordinary libraries: they must
# match the KNIME version this extension targets, so they are pinned to 5.13 rather than
# tracking latest. Left unbounded, the nightly channel drifts them to the next dev line
# and the extension silently gets built against an API the target AP does not have.
knime-extension = "5.13.*"
knime-python-base = "5.13.*"
knime-python-versions = "5.13.*"   # geo-compatible build (icu-enabled libxml2 on osx-arm64)

# --- geospatial extension deps (bumped to py3.13) ---
contextily = ">=1.6.2"
curl = "*"
cvxopt = ">=1.3.2"
esda = ">=2.7.0"
fiona = ">=1.10.1"
folium = ">=0.19.6"
geopandas = ">=1.1.1"
geopy = ">=2.4.1"
h3-py = ">=4.2.2"
jmespath = ">=1.0.1"
# keplergl comes from PyPI, not conda: conda-forge is capped at 0.3.2 and the kepler.gl 3.x
# bundle this view targets only ships in 0.3.7. See [pypi-dependencies].
libpysal = "*"
mgwr = ">=2.2.1"
osmnx = ">=2.0.3"
pointpats = ">=2.5.1"
polyline = ">=2.0.2"
pyproj = ">=3.7.1"
# Depend on the individual PySAL components the extension actually imports
# (esda / libpysal / mgwr / pointpats / spreg) instead of the `pysal` meta-package.
# The meta pulls in `spopt`, which hard-pins conda `pulp` to 2.8.0 and blocks the
# newer PyPI pulp (see [pypi-dependencies]); spopt itself is unused.
spreg = ">=1.8"
rasterio = ">=1.4.3"
# rtree is imported directly in spatialnetwork.py (spatial index for the Road Network
# nodes). geopandas 1.x no longer pulls it in transitively, so declare it explicitly.
rtree = ">=1.3"
# seaborn (spatialstatistics plots) and sympy (top-level import in geolab.py) were only
# pulled in transitively before; they are no longer, so declare them explicitly.
seaborn = ">=0.13"
sympy = ">=1.13"

[pypi-dependencies]
ipinfo = ">=5.6"
sodapy = ">=2.2"
# keplergl 0.3.7 (kepler.gl 3.x). conda-forge only has 0.3.2 and PyPI ships 0.3.7 only as an
# sdist, which pixi-pack (used by knime-extension-bundling) refuses: it packs wheels only.
# The wheel below was built from that sdist with plain setuptools (the prebuilt static assets
# ship in the sdist, so no yarn build runs) and is attached to the "keplergl-0.3.7-wheel"
# release of the knime-community fork. NOTE: 0.3.7 still does `from pkg_resources import
# resource_string`, so the pkg_resources shim in visualize.py is still required.
keplergl = { url = "https://github.com/knime-community/knime-geospatial-extension/releases/download/keplergl-0.3.7-wheel/keplergl-0.3.7-py2.py3-none-any.whl" }
# New hard runtime imports in keplergl 0.3.7 (keplergl.py top level); 0.3.2 had neither.
geoarrow-pyarrow = ">=0.1.2"
geoarrow-pandas = ">=0.1.1"
# pulp from PyPI, not conda: conda-forge is capped at 2.8.0 (pulled transitively via
# spopt), whose CBC invocation fails to execute in the bundled KNIME env on Windows.
# The PyPI wheel is py3-none-any and bundles CBC for all platforms, so bundling accepts
# it everywhere.
pulp = ">=3.3.2"

# pygeoda has no macOS-x86_64 (osx-64) cp313 wheel, only win_amd64 / linux_x86_64 /
# macOS-arm64. build-python-extension packs all 4 KNIME platforms and rejects non-wheel
# deps, so it is declared per-platform below (omitted on osx-64). pygeoda is lazy-imported
# in src/nodes/spatialclustering.py, so on osx-64 only the SKATER / REDCAP / MaxP / LISA
# nodes are unavailable; the rest of the extension loads and tests normally.

[target.win-64.pypi-dependencies]
pygeoda = "==0.1.2"

[target.linux-64.pypi-dependencies]
pygeoda = "==0.1.2"

[target.osx-arm64.pypi-dependencies]
pygeoda = "==0.1.2"

[feature.build.dependencies]
python = "*"
knime-extension-bundling = "6.1.*"
pixi-pack = ">=0.7.7"          # bundling 6.x ships pixi 0.70 (lockfile v7); pixi-pack < 0.7.7 reads v6 only

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "build-python-extension . {{ dest }} --disable-strict-enforcement --update-sites-version nightly" }

[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}
