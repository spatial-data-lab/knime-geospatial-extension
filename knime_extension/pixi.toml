[workspace]
name = "geospatial_env"
channels = ["knime/label/nightly", "knime", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
format = { cmd = "ruff format ." }

[dependencies]
python = "*"
knime-extension = "*"
knime-python-base = "*"
knime-python-versions = "5.12.*"   # geo-compatible build (icu-enabled libxml2 on osx-arm64)

# --- geospatial extension deps (bumped to py3.13) ---
contextily = ">=1.6.2"
curl = "*"
cvxopt = ">=1.3.2"
esda = ">=2.7.0"
fiona = ">=1.10.1"
folium = ">=0.19.6"
geopandas = ">=1.1.1"
geopy = ">=2.4.1"
h3-py = ">=4.2.2"
jmespath = ">=1.0.1"
keplergl = "*"
libpysal = "*"
mgwr = ">=2.2.1"
osmnx = ">=2.0.3"
pointpats = ">=2.5.1"
polyline = ">=2.0.2"
pulp = ">=2.8.0"
pyproj = ">=3.7.1"
pysal = ">=25.1"
rasterio = ">=1.4.3"

[pypi-dependencies]
ipinfo = "==5.1.1"
sodapy = "==2.2.0"
# pygeoda dropped: 0.1.2 has no macOS-x86_64 (osx-64) wheel, only
# linux-x86_64 / win_amd64 / macOS-arm64. build-python-extension packs all 4 KNIME
# platforms and rejects non-wheel deps, so osx-64 fails. pygeoda is lazy-imported in
# src/nodes/spatialclustering.py, so only the LISA / local-spatial-autocorrelation
# nodes are affected; the rest of the extension loads and tests normally.

[feature.build.dependencies]
python = "*"
knime-extension-bundling = "5.12.*"

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "build-python-extension . {{ dest }} --disable-strict-enforcement --update-sites-version 5.12" }

[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}
